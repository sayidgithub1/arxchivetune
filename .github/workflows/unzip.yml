name: Auto Unzip
on:
  push:
    paths:
      - '*.zip'
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Ekstrak dan Pindahkan ke Root
        run: |
          unzip -o *.zip -d temp_extract
          rm *.zip
          
          # Cek folder utama, hapus .github bawaan dari ZIP agar tidak bentrok, lalu pindahkan
          if [ $(ls -1 temp_extract | wc -l) -eq 1 ]; then
            FOLDER_NAME=$(ls -1 temp_extract)
            rm -rf temp_extract/"$FOLDER_NAME"/.github
            cp -a temp_extract/"$FOLDER_NAME"/. ./
          else
            rm -rf temp_extract/.github
            cp -a temp_extract/. ./
          fi
          
          rm -rf temp_extract
      - name: Simpan Hasil
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto extract ZIP ke root via Actions"
          git push
