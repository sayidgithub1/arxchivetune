name: Auto Unzip
on:
  push:
    paths:
      - '*.zip'
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Ekstrak dan Hapus ZIP
        run: |
          unzip -o *.zip -d .
          rm *.zip
      - name: Simpan Hasil Ekstrak
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto extract ZIP via Actions"
          git push
